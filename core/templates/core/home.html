{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ my_profile.name }}</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="bg-[#E6E6E6]">

    <div class="mt-32 ml-16">

        <img
            src="{{ my_profile.photo.url }}"
            alt="{{ my_profile.name }}"
            class="h-36 w-36 rounded-full object-cover"
        >

        <div class="mt-6 text-7xl font-bold">
            {{ my_profile.name }}
        </div>
             
        <div class="m-4 text-2xl">
            <span>{{ my_profile.location }}</span>
            <span class="ml-8">Bhopal</span>
        </div>
           <div class="text-xl italic w-64 ">
                {{ my_profile.tagline }}
            </div>

           <div class="mt-6 flex items-stretch border-amber-500">
               <input
                    name="q"
                     type="text"
                      placeholder="Send an Anonymous Message"
                         class="h-12 w-96 rounded-l-lg border  px-4 py-3"
                               />

    <button
        type="submit"
        class="h-12 rounded-r-lg bg-[#BC8A1C] px-5 text-white hover:opacity-50 font-bold hover:cursor-pointer"
        onclick="alert('Button Clicked')"
    >
        Send
    </button>
                                                   </div>

    <!-- cards -->
    <div>




    </div>
{% load django_browser_reload %}

{% django_browser_reload_script %}

</body>

</html>
