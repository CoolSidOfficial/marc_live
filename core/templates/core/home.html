{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ my_profile.name }}</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="bg-[#E6E6E6]">

    <div class="mt-9 ml-16">

        <img
            src="{{ my_profile.photo.url }}"
            alt="{{ my_profile.name }}"
            class="h-24 w-24 rounded-full object-cover"
        >

        <div class="mt-6 text-7xl font-bold">
            {{ my_profile.name }}
        </div>

        <div class="mt-40">
            <span>{{ my_profile.location }}</span>
            <span>Bhopal</span>
        </div>

        <div class="mt-8">

            <div class="text-xl italic">
                {{ my_profile.tagline }}
            </div>

            <input id="q"
                type="text"
                placeholder="What's on your mind?"
                class="mt-6 rounded-lg border px-4 py-3"
            >

        </div>

    </div>

    <!-- cards -->
    <div>
    </div>

</body>

</html>
